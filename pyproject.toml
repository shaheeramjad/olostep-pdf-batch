[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "olostep-pdf-batch"
version = "0.1.0"
description = "Scrape thousands of PDFs into an AI-ready Markdown dataset with Olostep Batches."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"  # the olostep SDK requires 3.11 to 3.13
dependencies = [
    "olostep>=1.2.3",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "httpx>=0.27",
    "streamlit>=1.40",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
olostep-pdf-batch = "olostep_pdf_batch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/olostep_pdf_batch"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["output", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["olostep_pdf_batch", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = ["ignore::DeprecationWarning:olostep.*"]
